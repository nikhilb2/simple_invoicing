server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The build stamp the running app polls to notice a new deployment. Pinned to
    # an exact match with `=404` because the SPA fallback below would otherwise
    # answer a missing file with index.html at 200, which the client would have
    # to parse as JSON. `no-cache` rather than `no-store` keeps ETag
    # revalidation, so a steady-state poll is a 304 with an empty body.
    location = /version.json {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
