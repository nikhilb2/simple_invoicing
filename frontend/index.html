<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#08111f" />
    <script>
      // Resolve the theme before any stylesheet or module loads so the first
      // paint is already right. Keep in step with src/store/useThemeStore.ts.
      (function () {
        var pref = 'system';
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') pref = stored;
        } catch (e) {}
        var theme = pref;
        if (pref === 'system') {
          try {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } catch (e) {
            theme = 'dark';
          }
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f4f7fb' : '#08111f');
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Simple Invoicing</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
